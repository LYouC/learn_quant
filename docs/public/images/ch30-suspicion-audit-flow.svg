<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" role="img" aria-labelledby="title desc">
  <title id="title">审查一份漂亮回测的顺序</title>
  <desc id="desc">审查流程自上而下分五步，并按能否一票否决分成三段。前两步是数据与样本、成交与成本，属于能一票否决的检查，放在最前面；第三步和第四步是试过多少次与参数稳不稳、因子之间是否重复，属于需要研究者自己交代的检查；第五步是没看过的那段数据，属于只能用一次的最终关卡。前两步便宜且能直接否掉结果，所以先做；第三、四步无法只看数据得出结论，需要补做检验；样本外放在最后不是因为不重要，而是因为反复使用会把它变成新的样本内数据。</desc>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-head"/>
    </marker>
    <style>
      .background { fill: #f8fafc; stroke: #cbd5e1; }
      .card { fill: #ffffff; stroke: #cbd5e1; }
      .heading { fill: #0f172a; font-size: 25px; font-weight: 700; }
      .subtle { fill: #64748b; font-size: 15px; }
      .title { fill: #0f172a; font-size: 20px; font-weight: 700; }
      .detail { fill: #475569; font-size: 16px; }
      .step-text { fill: #ffffff; font-size: 20px; font-weight: 700; text-anchor: middle; dominant-baseline: middle; }
      .step-data { fill: #0f766e; }
      .step-proc { fill: #b45309; }
      .step-oos { fill: #6d28d9; }
      .accent-data { fill: #0f766e; }
      .accent-proc { fill: #b45309; }
      .accent-oos { fill: #6d28d9; }
      .chip-text { font-size: 15px; font-weight: 700; text-anchor: middle; }
      .chip-data { fill: #ccfbf1; stroke: #0f766e; }
      .chip-proc { fill: #fef3c7; stroke: #b45309; }
      .chip-oos { fill: #ede9fe; stroke: #6d28d9; }
      .chip-text-data { fill: #115e59; }
      .chip-text-proc { fill: #92400e; }
      .chip-text-oos { fill: #5b21b6; }
      .arrow { fill: none; stroke: #64748b; stroke-width: 3; marker-end: url(#arrowhead); }
      .arrow-head { fill: #64748b; }
      .foot { fill: #475569; font-size: 15px; }
      text { font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif; }
      @media (prefers-color-scheme: dark) {
        .background { fill: #111827; stroke: #475569; }
        .card { fill: #1f2937; stroke: #475569; }
        .heading { fill: #f8fafc; }
        .subtle { fill: #94a3b8; }
        .title { fill: #f8fafc; }
        .detail { fill: #cbd5e1; }
        .step-data { fill: #14b8a6; }
        .step-proc { fill: #f59e0b; }
        .step-oos { fill: #8b5cf6; }
        .accent-data { fill: #14b8a6; }
        .accent-proc { fill: #f59e0b; }
        .accent-oos { fill: #8b5cf6; }
        .chip-data { fill: #134e4a; stroke: #14b8a6; }
        .chip-proc { fill: #78350f; stroke: #f59e0b; }
        .chip-oos { fill: #4c1d95; stroke: #8b5cf6; }
        .chip-text-data { fill: #99f6e4; }
        .chip-text-proc { fill: #fde68a; }
        .chip-text-oos { fill: #ddd6fe; }
        .arrow { stroke: #94a3b8; }
        .arrow-head { fill: #94a3b8; }
        .foot { fill: #cbd5e1; }
      }
    </style>
  </defs>

  <rect class="background" x="15" y="15" width="970" height="670" rx="24"/>
  <text class="heading" x="55" y="58">审查一份漂亮回测的顺序</text>
  <text class="subtle" x="55" y="88">先查便宜且能否掉结果的，再查需要研究者交代的，最后才能动用只能用一次的样本外</text>

  <g>
    <rect class="card" x="55" y="110" width="890" height="90" rx="16"/>
    <rect class="accent-data" x="55" y="110" width="10" height="90" rx="5"/>
    <circle class="step-data" cx="105" cy="155" r="25"/>
    <text class="step-text" x="105" y="156">1</text>
    <text class="title" x="150" y="148">数据与样本</text>
    <text class="detail" x="150" y="178">股票池按哪天的名单？每条数据哪天可用？</text>
    <rect class="chip-data" x="760" y="138" width="165" height="34" rx="17"/>
    <text class="chip-text chip-text-data" x="842" y="160">能一票否决</text>
  </g>

  <path class="arrow" d="M 500 202 L 500 226"/>

  <g>
    <rect class="card" x="55" y="228" width="890" height="90" rx="16"/>
    <rect class="accent-data" x="55" y="228" width="10" height="90" rx="5"/>
    <circle class="step-data" cx="105" cy="273" r="25"/>
    <text class="step-text" x="105" y="274">2</text>
    <text class="title" x="150" y="266">成交与成本</text>
    <text class="detail" x="150" y="296">成交价与费用假设？买不到时怎么处理？</text>
    <rect class="chip-data" x="760" y="256" width="165" height="34" rx="17"/>
    <text class="chip-text chip-text-data" x="842" y="278">能一票否决</text>
  </g>

  <path class="arrow" d="M 500 320 L 500 344"/>

  <g>
    <rect class="card" x="55" y="346" width="890" height="90" rx="16"/>
    <rect class="accent-proc" x="55" y="346" width="10" height="90" rx="5"/>
    <circle class="step-proc" cx="105" cy="391" r="25"/>
    <text class="step-text" x="105" y="392">3</text>
    <text class="title" x="150" y="384">试过多少次、参数稳不稳</text>
    <text class="detail" x="150" y="414">版本数要记录；参数邻域里找针尖</text>
    <rect class="chip-proc" x="760" y="374" width="165" height="34" rx="17"/>
    <text class="chip-text chip-text-proc" x="842" y="396">需要自己交代</text>
  </g>

  <path class="arrow" d="M 500 438 L 500 462"/>

  <g>
    <rect class="card" x="55" y="464" width="890" height="90" rx="16"/>
    <rect class="accent-proc" x="55" y="464" width="10" height="90" rx="5"/>
    <circle class="step-proc" cx="105" cy="509" r="25"/>
    <text class="step-text" x="105" y="510">4</text>
    <text class="title" x="150" y="502">因子之间是否重复</text>
    <text class="detail" x="150" y="532">相关矩阵、排序重叠率、增量贡献</text>
    <rect class="chip-proc" x="760" y="492" width="165" height="34" rx="17"/>
    <text class="chip-text chip-text-proc" x="842" y="514">需要自己交代</text>
  </g>

  <path class="arrow" d="M 500 556 L 500 580"/>

  <g>
    <rect class="card" x="55" y="582" width="890" height="90" rx="16"/>
    <rect class="accent-oos" x="55" y="582" width="10" height="90" rx="5"/>
    <circle class="step-oos" cx="105" cy="627" r="25"/>
    <text class="step-text" x="105" y="628">5</text>
    <text class="title" x="150" y="620">没看过的那段数据</text>
    <text class="detail" x="150" y="650">事先切分，而且只能用一次</text>
    <rect class="chip-oos" x="760" y="610" width="165" height="34" rx="17"/>
    <text class="chip-text chip-text-oos" x="842" y="632">只能用一次</text>
  </g>
</svg>
