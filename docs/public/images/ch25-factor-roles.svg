<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 470" role="img" aria-labelledby="title desc">
  <title id="title">三类因子在选股流程中的位置</title>
  <desc id="desc">从左到右是一条选股流水线：全部A股先经过流动性筛选，用成交额下限和Amihud上限排除买不进卖不出的股票；接着按价值、质量、成长、动量打分排序，同时用波动做门槛和风险约束；然后用交易行为做修正，按换手率档位和量价背离加档或降档；最后得到可交易且已排序的候选名单，交给组合构建。图要说明的是三类因子处在流程的不同位置，而不是三个并列的打分项。</desc>
  <defs>
    <style>
      .background { fill: #f8fafc; stroke: #cbd5e1; }
      .box { fill: #ffffff; stroke: #94a3b8; stroke-width: 2; }
      .box-flow { fill: #dbeafe; stroke: #2563eb; stroke-width: 2; }
      .box-score { fill: #ede9fe; stroke: #7c3aed; stroke-width: 2; }
      .box-fix { fill: #ffedd5; stroke: #ea580c; stroke-width: 2; }
      .box-result { fill: #dcfce7; stroke: #16a34a; stroke-width: 2; }
      .heading { fill: #0f172a; font-size: 25px; font-weight: 700; }
      .subtle { fill: #64748b; font-size: 15px; }
      .box-title { fill: #0f172a; font-size: 18px; font-weight: 700; }
      .line { fill: #475569; font-size: 15px; }
      .foot { fill: #475569; font-size: 15px; }
      .arrow { stroke: #64748b; stroke-width: 3; fill: none; }
      text { font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif; }
      @media (prefers-color-scheme: dark) {
        .background { fill: #111827; stroke: #475569; }
        .box { fill: #1f2937; stroke: #64748b; }
        .box-flow { fill: #172554; stroke: #60a5fa; }
        .box-score { fill: #2e1065; stroke: #a78bfa; }
        .box-fix { fill: #431407; stroke: #fb923c; }
        .box-result { fill: #052e16; stroke: #22c55e; }
        .heading, .box-title { fill: #f8fafc; }
        .subtle { fill: #94a3b8; }
        .line, .foot { fill: #cbd5e1; }
        .arrow { stroke: #94a3b8; }
      }
    </style>
    <marker id="pipe-arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect class="background" x="15" y="15" width="1090" height="440" rx="24"/>
  <text class="heading" x="55" y="62">三类因子在选股流程中的位置</text>
  <text class="subtle" x="55" y="94">示意：流动性在门口，其他因子在中间打分，交易行为在出口做微调</text>

  <rect class="box" x="45" y="180" width="170" height="160" rx="14"/>
  <text class="box-title" x="67" y="213">全部 A 股</text>
  <text class="line" x="67" y="249">当日可交易的股票</text>
  <text class="line" x="67" y="279">含各板块与市值层次</text>
  <text class="line" x="67" y="309">尚未做任何排除</text>

  <rect class="box-flow" x="240" y="180" width="170" height="160" rx="14"/>
  <text class="box-title" x="262" y="213">① 流动性筛选</text>
  <text class="line" x="262" y="249">成交额下限</text>
  <text class="line" x="262" y="279">Amihud 上限</text>
  <text class="line" x="262" y="309">只管买不买得到</text>

  <rect class="box-score" x="435" y="180" width="200" height="160" rx="14"/>
  <text class="box-title" x="457" y="213">② 因子打分</text>
  <text class="line" x="457" y="249">价值、质量、成长、动量</text>
  <text class="line" x="457" y="279">波动做门槛与风险约束</text>
  <text class="line" x="457" y="309">检查与规模是否重复</text>

  <rect class="box-fix" x="660" y="180" width="175" height="160" rx="14"/>
  <text class="box-title" x="682" y="213">③ 交易行为修正</text>
  <text class="line" x="682" y="249">换手率档位</text>
  <text class="line" x="682" y="279">量价背离</text>
  <text class="line" x="682" y="309">只加减档，不给方向</text>

  <rect class="box-result" x="860" y="180" width="190" height="160" rx="14"/>
  <text class="box-title" x="882" y="213">候选名单</text>
  <text class="line" x="882" y="249">可交易 + 已排序</text>
  <text class="line" x="882" y="279">进入第33章组合构建</text>
  <text class="line" x="882" y="309">再接受成本与成交检验</text>

  <path class="arrow" d="M215 260 H234" marker-end="url(#pipe-arrow)"/>
  <path class="arrow" d="M410 260 H429" marker-end="url(#pipe-arrow)"/>
  <path class="arrow" d="M635 260 H654" marker-end="url(#pipe-arrow)"/>
  <path class="arrow" d="M835 260 H854" marker-end="url(#pipe-arrow)"/>

  <text class="foot" x="55" y="392">三类因子不是三个并列的打分项：把“买不到”混进一张加权总分，会让高分掩盖不可交易这件事。</text>
  <text class="foot" x="55" y="424">流动性决定谁能进门，波动约束风险，交易行为只做加减档——顺序和位置本身就是内容的一部分。</text>
</svg>
