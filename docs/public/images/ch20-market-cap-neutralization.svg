<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-labelledby="title desc">
  <title id="title">市值中性化：在全市场分组与在市值层内分组</title>
  <desc id="desc">左栏表示在全部股票上按因子直接分组，高分组中小盘股占比远高于股票池，收益差同时含有因子和规模；右栏表示先按市值分三层，再在每层内部按同样比例取高分组，只在同规模公司之间比较。</desc>
  <defs>
    <style>
      .background { fill: #f8fafc; stroke: #cbd5e1; }
      .row { fill: #ffffff; stroke: #cbd5e1; }
      .high { fill: #2563eb; }
      .heading { fill: #0f172a; font-size: 24px; font-weight: 700; }
      .subheading { fill: #334155; font-size: 18px; font-weight: 600; }
      .layer { fill: #0f172a; font-size: 18px; font-weight: 600; }
      .detail { fill: #475569; font-size: 17px; }
      .pct { fill: #334155; font-size: 16px; font-weight: 600; }
      .divider { stroke: #cbd5e1; stroke-width: 2; stroke-dasharray: 6 6; }
      text { font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif; }
      @media (prefers-color-scheme: dark) {
        .background { fill: #111827; stroke: #475569; }
        .row { fill: #1f2937; stroke: #475569; }
        .high { fill: #3b82f6; }
        .heading { fill: #f8fafc; }
        .subheading { fill: #cbd5e1; }
        .layer { fill: #f8fafc; }
        .detail { fill: #cbd5e1; }
        .pct { fill: #cbd5e1; }
        .divider { stroke: #475569; }
      }
    </style>
  </defs>

  <rect class="background" x="15" y="15" width="970" height="490" rx="24"/>

  <text class="heading" x="60" y="62">市值中性化：在全市场分组与在市值层内分组</text>
  <text class="detail" x="60" y="94">示意：每行是一个市值层，蓝色区域表示该层中被选入高分组的股票</text>

  <text class="subheading" x="124" y="150">① 全部股票放在一起，按因子分组</text>
  <text class="subheading" x="584" y="150">② 先按市值分层，再在层内分组</text>

  <text class="layer" x="70" y="214">大盘</text>
  <text class="layer" x="70" y="300">中盘</text>
  <text class="layer" x="70" y="386">小盘</text>

  <text class="layer" x="530" y="214">大盘</text>
  <text class="layer" x="530" y="300">中盘</text>
  <text class="layer" x="530" y="386">小盘</text>

  <rect class="row" x="124" y="176" width="316" height="64" rx="8"/>
  <rect class="row" x="124" y="262" width="316" height="64" rx="8"/>
  <rect class="row" x="124" y="348" width="316" height="64" rx="8"/>

  <rect class="high" x="393" y="176" width="47" height="64" rx="8"/>
  <rect class="high" x="314" y="262" width="126" height="64" rx="8"/>
  <rect class="high" x="171" y="348" width="269" height="64" rx="8"/>

  <text class="pct" x="383" y="213" text-anchor="end">15%</text>
  <text class="pct" x="304" y="299" text-anchor="end">40%</text>
  <text class="pct" x="161" y="385" text-anchor="end">85%</text>

  <rect class="row" x="584" y="176" width="316" height="64" rx="8"/>
  <rect class="row" x="584" y="262" width="316" height="64" rx="8"/>
  <rect class="row" x="584" y="348" width="316" height="64" rx="8"/>

  <rect class="high" x="774" y="176" width="126" height="64" rx="8"/>
  <rect class="high" x="774" y="262" width="126" height="64" rx="8"/>
  <rect class="high" x="774" y="348" width="126" height="64" rx="8"/>

  <text class="pct" x="764" y="213" text-anchor="end">40%</text>
  <text class="pct" x="764" y="299" text-anchor="end">40%</text>
  <text class="pct" x="764" y="385" text-anchor="end">40%</text>

  <line class="divider" x1="484" y1="140" x2="484" y2="470"/>

  <text class="detail" x="124" y="440">高分组里小盘股占比远高于股票池，</text>
  <text class="detail" x="124" y="466">收益差同时含有因子和规模。</text>

  <text class="detail" x="584" y="440">每家公司只与同规模的公司比较，</text>
  <text class="detail" x="584" y="466">汇总结果更接近因子自身的贡献。</text>
</svg>
