<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" role="img" aria-labelledby="title desc">
  <title id="title">因子预处理流水线</title>
  <desc id="desc">自上而下五步：第一步选定因子形态，只定含义不改数值；第二步判断并处理缺失与极端值，决定哪些股票有资格参与这一列的比较；第三步做行业与市值中性化，去掉不准备承担的暴露；第四步标准化或转成排名，把不同尺度的因子放到同一把尺子上；第五步得到可比因子值，进入第29章检验与第31章合成。图右侧标注每一步对这一列数字做了什么，其中第二、三、四步都在删信息，图要说明的是删掉哪一部分是可以选的，这正是因子含义被改写的地方。</desc>
  <defs>
    <marker id="p-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" class="arrow-head"/>
    </marker>
    <style>
      .background { fill: #f8fafc; stroke: #cbd5e1; }
      .card { fill: #ffffff; stroke: #cbd5e1; }
      .accent { fill: #2563eb; }
      .step { fill: #2563eb; }
      .step-text { fill: #ffffff; font-size: 20px; font-weight: 700; text-anchor: middle; dominant-baseline: middle; }
      .heading { fill: #0f172a; font-size: 25px; font-weight: 700; }
      .subtle { fill: #64748b; font-size: 15px; }
      .card-title { fill: #0f172a; font-size: 19px; font-weight: 700; }
      .detail { fill: #475569; font-size: 15px; }
      .badge { font-size: 15px; font-weight: 700; text-anchor: end; }
      .badge-a { fill: #2563eb; }
      .badge-b { fill: #ea580c; }
      .badge-c { fill: #7c3aed; }
      .badge-d { fill: #16a34a; }
      .arrow { fill: none; stroke: #64748b; stroke-width: 3; marker-end: url(#p-arrow); }
      .arrow-head { fill: #64748b; }
      .foot { fill: #475569; font-size: 15px; }
      text { font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif; }
      @media (prefers-color-scheme: dark) {
        .background { fill: #111827; stroke: #475569; }
        .card { fill: #1f2937; stroke: #475569; }
        .accent { fill: #60a5fa; }
        .step { fill: #60a5fa; }
        .step-text { fill: #0f172a; }
        .heading { fill: #f8fafc; }
        .subtle { fill: #94a3b8; }
        .card-title { fill: #f8fafc; }
        .detail { fill: #cbd5e1; }
        .badge-a { fill: #60a5fa; }
        .badge-b { fill: #fb923c; }
        .badge-c { fill: #a78bfa; }
        .badge-d { fill: #22c55e; }
        .arrow { stroke: #94a3b8; }
        .arrow-head { fill: #94a3b8; }
        .foot { fill: #cbd5e1; }
      }
    </style>
  </defs>

  <rect class="background" x="15" y="15" width="970" height="770" rx="24"/>
  <text class="heading" x="55" y="62">因子预处理流水线</text>
  <text class="subtle" x="55" y="94">示意：从一列原始数字，到可以检验、可以合成的因子值</text>

  <g>
    <rect class="card" x="55" y="125" width="890" height="100" rx="16"/>
    <rect class="accent" x="55" y="125" width="10" height="100" rx="5"/>
    <circle class="step" cx="105" cy="175" r="25"/>
    <text class="step-text" x="105" y="176">1</text>
    <text class="card-title" x="150" y="168">选定因子形态</text>
    <text class="detail" x="150" y="198">水平、变化、同比还是相对？先写下“数值越高代表什么”</text>
    <text class="badge badge-a" x="920" y="176">只定含义，不改数值</text>
  </g>

  <path class="arrow" d="M 500 227 L 500 243"/>

  <g>
    <rect class="card" x="55" y="245" width="890" height="100" rx="16"/>
    <rect class="accent" x="55" y="245" width="10" height="100" rx="5"/>
    <circle class="step" cx="105" cy="295" r="25"/>
    <text class="step-text" x="105" y="296">2</text>
    <text class="card-title" x="150" y="288">判断并处理缺失与极端值</text>
    <text class="detail" x="150" y="318">不适用则排除，未披露保留标记，极端值缩尾或取对数</text>
    <text class="badge badge-b" x="920" y="296">删掉参与资格</text>
  </g>

  <path class="arrow" d="M 500 347 L 500 363"/>

  <g>
    <rect class="card" x="55" y="365" width="890" height="100" rx="16"/>
    <rect class="accent" x="55" y="365" width="10" height="100" rx="5"/>
    <circle class="step" cx="105" cy="415" r="25"/>
    <text class="step-text" x="105" y="416">3</text>
    <text class="card-title" x="150" y="408">行业与市值中性化</text>
    <text class="detail" x="150" y="438">把不准备承担的行业和规模影响，从这一列数值里减掉</text>
    <text class="badge badge-b" x="920" y="416">删掉行业与规模</text>
  </g>

  <path class="arrow" d="M 500 467 L 500 483"/>

  <g>
    <rect class="card" x="55" y="485" width="890" height="100" rx="16"/>
    <rect class="accent" x="55" y="485" width="10" height="100" rx="5"/>
    <circle class="step" cx="105" cy="535" r="25"/>
    <text class="step-text" x="105" y="536">4</text>
    <text class="card-title" x="150" y="528">标准化或转成排名</text>
    <text class="detail" x="150" y="558">把不同尺度的因子放到同一把尺子上，只换刻度、不改次序</text>
    <text class="badge badge-c" x="920" y="536">换刻度或压平距离</text>
  </g>

  <path class="arrow" d="M 500 587 L 500 603"/>

  <g>
    <rect class="card" x="55" y="605" width="890" height="100" rx="16"/>
    <rect class="accent" x="55" y="605" width="10" height="100" rx="5"/>
    <circle class="step" cx="105" cy="655" r="25"/>
    <text class="step-text" x="105" y="656">5</text>
    <text class="card-title" x="150" y="648">可比因子值</text>
    <text class="detail" x="150" y="678">连同覆盖率与含义说明，进入第29章检验与第31章合成</text>
    <text class="badge badge-d" x="920" y="656">待检验</text>
  </g>

  <text class="foot" x="55" y="742">顺序不能交换：缺失判断放在所有计算之前，缩尾放在标准化和回归之前。</text>
  <text class="foot" x="55" y="772">第 2、3、4 步都在删信息——删掉哪一部分是可以选的，这就是因子含义被改写的地方。</text>
</svg>
