<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc">
  <title id="title">参数邻域：稳定信号是平原，挑出来的信号是针尖</title>
  <desc id="desc">横轴是同一个参数取五个不同的值，纵轴是因子值与下一期收益的 IC，数据均为示意。蓝色曲线代表稳定信号，五个参数取值下的 IC 分别是 0.038、0.042、0.040、0.037、0.033，随参数变化缓慢起伏；橙色曲线代表被挑出来的信号，五个取值下的 IC 分别是 0.002、0.005、0.048、0.004 和负的 0.003，只在中间那一个点上出现孤立的高峰，两侧立刻塌下去。图要说明参数邻域的形状比参数的最优值更能说明问题：平原形状的信号可以在任意参数附近使用，针尖形状的信号只能在历史数据里那个特定的点上好看。</desc>
  <defs>
    <style>
      .background { fill: #f8fafc; stroke: #cbd5e1; }
      .panel { fill: #ffffff; stroke: #cbd5e1; }
      .heading { fill: #0f172a; font-size: 25px; font-weight: 700; }
      .subtle { fill: #64748b; font-size: 15px; }
      .grid { stroke: #e2e8f0; stroke-width: 1; }
      .axis { stroke: #94a3b8; stroke-width: 2; }
      .tick { fill: #64748b; font-size: 14px; }
      .line-flat { fill: none; stroke: #2563eb; stroke-width: 3.5; }
      .line-spike { fill: none; stroke: #ea580c; stroke-width: 3.5; }
      .dot-flat { fill: #2563eb; }
      .dot-spike { fill: #ea580c; }
      .label-flat { fill: #1d4ed8; font-size: 14px; font-weight: 700; text-anchor: middle; }
      .label-spike { fill: #c2410c; font-size: 14px; font-weight: 700; text-anchor: middle; }
      .axis-name { fill: #475569; font-size: 15px; font-weight: 700; }
      .legend { font-size: 15px; font-weight: 700; }
      .legend-flat { fill: #1d4ed8; }
      .legend-spike { fill: #c2410c; }
      .foot { fill: #475569; font-size: 15px; }
      text { font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif; }
      @media (prefers-color-scheme: dark) {
        .background { fill: #111827; stroke: #475569; }
        .panel { fill: #1f2937; stroke: #475569; }
        .heading { fill: #f8fafc; }
        .subtle { fill: #94a3b8; }
        .grid { stroke: #334155; }
        .axis { stroke: #64748b; }
        .tick { fill: #94a3b8; }
        .line-flat { stroke: #60a5fa; }
        .line-spike { stroke: #fb923c; }
        .dot-flat { fill: #60a5fa; }
        .dot-spike { fill: #fb923c; }
        .label-flat { fill: #93c5fd; }
        .label-spike { fill: #fdba74; }
        .axis-name { fill: #cbd5e1; }
        .legend-flat { fill: #93c5fd; }
        .legend-spike { fill: #fdba74; }
        .foot { fill: #cbd5e1; }
      }
    </style>
  </defs>

  <rect class="background" x="15" y="15" width="970" height="570" rx="24"/>
  <text class="heading" x="55" y="58">参数邻域：把参数在最优值附近展开，看结果是平原还是针尖</text>
  <text class="subtle" x="55" y="88">示意：横轴为同一参数的五个取值，纵轴为该取值下的 IC（无量纲）</text>

  <line class="line-flat" x1="60" y1="118" x2="108" y2="118"/>
  <text class="legend legend-flat" x="118" y="123">稳定信号：参数变化时结果缓慢起伏</text>
  <line class="line-spike" x1="560" y1="118" x2="608" y2="118"/>
  <text class="legend legend-spike" x="618" y="123">挑出来的信号：只有一个孤立的尖峰</text>

  <rect class="panel" x="55" y="135" width="890" height="370" rx="16"/>

  <line class="grid" x1="150" y1="160" x2="920" y2="160"/>
  <line class="grid" x1="150" y1="212" x2="920" y2="212"/>
  <line class="grid" x1="150" y1="264" x2="920" y2="264"/>
  <line class="grid" x1="150" y1="316" x2="920" y2="316"/>
  <line class="grid" x1="150" y1="368" x2="920" y2="368"/>

  <text class="tick" x="140" y="165" text-anchor="end">0.05</text>
  <text class="tick" x="140" y="217" text-anchor="end">0.04</text>
  <text class="tick" x="140" y="269" text-anchor="end">0.03</text>
  <text class="tick" x="140" y="321" text-anchor="end">0.02</text>
  <text class="tick" x="140" y="373" text-anchor="end">0.01</text>
  <text class="tick" x="140" y="425" text-anchor="end">0.00</text>

  <line class="axis" x1="150" y1="420" x2="920" y2="420"/>
  <line class="axis" x1="150" y1="452" x2="150" y2="145"/>

  <line class="axis" x1="180" y1="420" x2="180" y2="430"/>
  <line class="axis" x1="350" y1="420" x2="350" y2="430"/>
  <line class="axis" x1="520" y1="420" x2="520" y2="430"/>
  <line class="axis" x1="690" y1="420" x2="690" y2="430"/>
  <line class="axis" x1="860" y1="420" x2="860" y2="430"/>

  <text class="tick" x="180" y="462" text-anchor="middle">取值 1</text>
  <text class="tick" x="350" y="462" text-anchor="middle">取值 2</text>
  <text class="tick" x="520" y="462" text-anchor="middle">取值 3</text>
  <text class="tick" x="690" y="462" text-anchor="middle">取值 4</text>
  <text class="tick" x="860" y="462" text-anchor="middle">取值 5</text>
  <text class="axis-name" x="60" y="490">IC</text>
  <text class="axis-name" x="915" y="490" text-anchor="end">参数取值</text>

  <polyline class="line-flat" points="180,222 350,202 520,212 690,228 860,248"/>
  <polyline class="line-spike" points="180,410 350,394 520,170 690,399 860,436"/>

  <circle class="dot-flat" cx="180" cy="222" r="7"/>
  <circle class="dot-flat" cx="350" cy="202" r="7"/>
  <circle class="dot-flat" cx="520" cy="212" r="7"/>
  <circle class="dot-flat" cx="690" cy="228" r="7"/>
  <circle class="dot-flat" cx="860" cy="248" r="7"/>

  <circle class="dot-spike" cx="180" cy="410" r="7"/>
  <circle class="dot-spike" cx="350" cy="394" r="7"/>
  <circle class="dot-spike" cx="520" cy="170" r="7"/>
  <circle class="dot-spike" cx="690" cy="399" r="7"/>
  <circle class="dot-spike" cx="860" cy="436" r="7"/>

  <text class="label-flat" x="180" y="208">0.038</text>
  <text class="label-flat" x="350" y="188">0.042</text>
  <text class="label-flat" x="520" y="198">0.040</text>
  <text class="label-flat" x="690" y="214">0.037</text>
  <text class="label-flat" x="860" y="234">0.033</text>

  <text class="label-spike" x="180" y="396">0.002</text>
  <text class="label-spike" x="350" y="380">0.005</text>
  <text class="label-spike" x="520" y="156">0.048</text>
  <text class="label-spike" x="690" y="385">0.004</text>
  <text class="label-spike" x="876" y="441" style="text-anchor: start">−0.003</text>

  <text class="foot" x="55" y="542">挑参数时看到的高点，往往只是历史数据里的一个位置；蓝色曲线在五个取值上都还有效，橙色曲线一旦离开取值 3 就什么都不剩。</text>
  <text class="foot" x="55" y="570">实盘时没人能保证参数正好落在最优点，所以能被使用的因子必须是平原形状，而不只是峰顶更高。</text>
</svg>
