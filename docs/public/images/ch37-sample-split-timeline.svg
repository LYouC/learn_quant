<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 655" role="img" aria-labelledby="title desc">
  <title id="title">三种样本外切法在同一条时间轴上的对照（示意）</title>
  <desc id="desc">三种切法都建立在同一份 2015 年到 2026 年 9 月的数据上，区别在边界划在哪里。第一种是前向切分：2015 到 2025 年用于研究加调参，2025 年之后留作样本外，只得到一段不到两年的测试期。第二种是滚动窗口：用前五年训练、在紧接着的一年上测试，然后整体向后滑动一年，重复六次，测试期分别从 2020 年到 2025 年开始，每段一年。第三种是锁定一段：2015 到 2023 年为研究段，2023 到 2024 年为验证段用来选方案，2024 年之后锁住不使用，在研究全部结束前不打开。三种切法共同的纪律是切法和用法必须在看到结果之前定好；三种做法只是示意，年份为便于对照而设定。</desc>
  <defs>
    <style>
      .background { fill: #f8fafc; stroke: #cbd5e1; }
      .heading { fill: #0f172a; font-size: 24px; font-weight: 700; }
      .subtle { fill: #64748b; font-size: 15px; }
      .deck-title { fill: #0f172a; font-size: 18px; font-weight: 700; }
      .row-label { fill: #64748b; font-size: 12px; }
      .seg-research { fill: #dbeafe; stroke: #60a5fa; stroke-width: 1.6; }
      .seg-test { fill: #fef3c7; stroke: #f59e0b; stroke-width: 1.6; }
      .seg-locked { fill: #e9d5ff; stroke: #a855f7; stroke-width: 1.6; }
      .seg-label { fill: #0f172a; font-size: 13px; }
      .note { fill: #475569; font-size: 13px; }
      .legend-text { fill: #334155; font-size: 13px; }
      .axis { stroke: #94a3b8; stroke-width: 2; }
      .tick { stroke: #94a3b8; stroke-width: 1.6; }
      .axis-label { fill: #64748b; font-size: 12px; }
      .foot { fill: #475569; font-size: 13px; }
      text { font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif; }
      @media (prefers-color-scheme: dark) {
        .background { fill: #111827; stroke: #475569; }
        .heading { fill: #f8fafc; }
        .subtle { fill: #94a3b8; }
        .deck-title { fill: #f8fafc; }
        .row-label { fill: #94a3b8; }
        .seg-research { fill: #1e3a8a; stroke: #60a5fa; }
        .seg-test { fill: #78350f; stroke: #fbbf24; }
        .seg-locked { fill: #4c1d95; stroke: #c084fc; }
        .seg-label { fill: #f8fafc; }
        .note { fill: #cbd5e1; }
        .legend-text { fill: #e2e8f0; }
        .axis { stroke: #64748b; }
        .tick { stroke: #64748b; }
        .axis-label { fill: #94a3b8; }
        .foot { fill: #cbd5e1; }
      }
    </style>
  </defs>

  <rect class="background" x="15" y="15" width="970" height="625" rx="24"/>
  <text class="heading" x="55" y="56">样本外不能随便切：三种切法，证据强度不同</text>
  <text class="subtle" x="55" y="86">同一份数据、同一条时间轴（2015—2026 年 9 月），区别在边界划在哪里｜年份为对照用示意</text>

  <text class="deck-title" x="55" y="124">① 前向切分：把最后一段留出来，样本外只有一次</text>
  <rect class="seg-research" x="130" y="136" width="667" height="32" rx="6"/>
  <rect class="seg-test" x="797" y="136" width="113" height="32" rx="6"/>
  <text class="seg-label" x="463" y="157" text-anchor="middle">研究＋调参（2015—2025）</text>
  <text class="seg-label" x="853" y="157" text-anchor="middle">样本外</text>

  <text class="deck-title" x="55" y="200">② 滚动窗口：训练 5 年、测试 1 年，向后滑动，重复六次</text>
  <rect class="seg-research" x="130" y="214" width="333" height="18" rx="4"/>
  <rect class="seg-test" x="463" y="214" width="67" height="18" rx="4"/>
  <text class="row-label" x="122" y="228" text-anchor="end">第 1 次</text>
  <rect class="seg-research" x="197" y="240" width="333" height="18" rx="4"/>
  <rect class="seg-test" x="530" y="240" width="67" height="18" rx="4"/>
  <text class="row-label" x="122" y="254" text-anchor="end">第 2 次</text>
  <rect class="seg-research" x="263" y="266" width="334" height="18" rx="4"/>
  <rect class="seg-test" x="597" y="266" width="67" height="18" rx="4"/>
  <text class="row-label" x="122" y="280" text-anchor="end">第 3 次</text>
  <rect class="seg-research" x="330" y="292" width="334" height="18" rx="4"/>
  <rect class="seg-test" x="664" y="292" width="66" height="18" rx="4"/>
  <text class="row-label" x="122" y="306" text-anchor="end">第 4 次</text>
  <rect class="seg-research" x="397" y="318" width="333" height="18" rx="4"/>
  <rect class="seg-test" x="730" y="318" width="67" height="18" rx="4"/>
  <text class="row-label" x="122" y="332" text-anchor="end">第 5 次</text>
  <rect class="seg-research" x="463" y="344" width="334" height="18" rx="4"/>
  <rect class="seg-test" x="797" y="344" width="66" height="18" rx="4"/>
  <text class="row-label" x="122" y="358" text-anchor="end">第 6 次</text>
  <text class="note" x="55" y="386">六次测试各自只有 1 年：观测更多，但每一段都更短、噪声更大</text>

  <text class="deck-title" x="55" y="418">③ 锁定一段：研究、验证分开，最后一段一次都不打开</text>
  <rect class="seg-research" x="130" y="430" width="534" height="32" rx="6"/>
  <rect class="seg-test" x="664" y="430" width="66" height="32" rx="6"/>
  <rect class="seg-locked" x="730" y="430" width="180" height="32" rx="6"/>
  <text class="seg-label" x="397" y="451" text-anchor="middle">研究段（2015—2023）</text>
  <text class="seg-label" x="697" y="451" text-anchor="middle">验证</text>
  <text class="seg-label" x="820" y="451" text-anchor="middle">锁定不用</text>
  <text class="note" x="55" y="484">验证段用来选方案；锁定段在全部研究结束之前不打开</text>

  <rect class="seg-research" x="130" y="504" width="26" height="14" rx="3"/>
  <text class="legend-text" x="164" y="516">研究、训练段</text>
  <rect class="seg-test" x="390" y="504" width="26" height="14" rx="3"/>
  <text class="legend-text" x="424" y="516">测试、验证段</text>
  <rect class="seg-locked" x="650" y="504" width="26" height="14" rx="3"/>
  <text class="legend-text" x="684" y="516">锁定段：不使用</text>

  <line class="axis" x1="130" y1="546" x2="910" y2="546"/>
  <g class="tick">
    <line x1="130" y1="546" x2="130" y2="554"/>
    <line x1="197" y1="546" x2="197" y2="554"/>
    <line x1="263" y1="546" x2="263" y2="554"/>
    <line x1="330" y1="546" x2="330" y2="554"/>
    <line x1="397" y1="546" x2="397" y2="554"/>
    <line x1="463" y1="546" x2="463" y2="554"/>
    <line x1="530" y1="546" x2="530" y2="554"/>
    <line x1="597" y1="546" x2="597" y2="554"/>
    <line x1="664" y1="546" x2="664" y2="554"/>
    <line x1="730" y1="546" x2="730" y2="554"/>
    <line x1="797" y1="546" x2="797" y2="554"/>
    <line x1="863" y1="546" x2="863" y2="554"/>
  </g>
  <text class="axis-label" x="130" y="574" text-anchor="middle">2015</text>
  <text class="axis-label" x="197" y="574" text-anchor="middle">2016</text>
  <text class="axis-label" x="263" y="574" text-anchor="middle">2017</text>
  <text class="axis-label" x="330" y="574" text-anchor="middle">2018</text>
  <text class="axis-label" x="397" y="574" text-anchor="middle">2019</text>
  <text class="axis-label" x="463" y="574" text-anchor="middle">2020</text>
  <text class="axis-label" x="530" y="574" text-anchor="middle">2021</text>
  <text class="axis-label" x="597" y="574" text-anchor="middle">2022</text>
  <text class="axis-label" x="664" y="574" text-anchor="middle">2023</text>
  <text class="axis-label" x="730" y="574" text-anchor="middle">2024</text>
  <text class="axis-label" x="797" y="574" text-anchor="middle">2025</text>
  <text class="axis-label" x="863" y="574" text-anchor="middle">2026</text>

  <text class="foot" x="55" y="606">三种切法共同的纪律：切法和用法必须在看到结果之前定好；测试段一旦被反复查看，就变成了新的样本内数据。</text>
  <text class="foot" x="55" y="628">前向切分只给一个观测；滚动窗口给多个短观测；锁定一段最干净，但机会只有一次。</text>
</svg>
