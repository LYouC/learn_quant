<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 880" role="img" aria-labelledby="title desc">
  <title id="title">把一个排序合出来：六个步骤，一次回炉</title>
  <desc id="desc">合成流程自上而下分六步，并按性质分成三组。前两步是准备工作：第一步把每个因子乘上正号或负号，统一成值越大越看好；第二步在同一个形成日把各因子转成同一口径的分数，默认用 0 到 100 的分位，也可以整章统一用 z 分数，但不能两种混用。第三、四步是决策，也是最容易被挑出问题的地方：第三步看两两相关系数，高的先处理（删一个、合成一个、正交化）；第四步定权重，默认分位等权，要偏离等权必须有样本外的依据，并且权重只能用形成日之前的数据估计。第五步按权重相加，或按排名相乘，得到每只股票一个总分。第六步是回炉：把这个总分当成一个新因子，重走第29章的检验与第30章的审查，不合格就退回第三步和第四步重做。图要说明合成不是最后一步收尾，而是一个还要被检验的新对象。</desc>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-head"/>
    </marker>
    <style>
      .background { fill: #f8fafc; stroke: #cbd5e1; }
      .card { fill: #ffffff; stroke: #cbd5e1; }
      .heading { fill: #0f172a; font-size: 25px; font-weight: 700; }
      .subtle { fill: #64748b; font-size: 15px; }
      .title { fill: #0f172a; font-size: 20px; font-weight: 700; }
      .detail { fill: #475569; font-size: 16px; }
      .step-text { fill: #ffffff; font-size: 20px; font-weight: 700; text-anchor: middle; dominant-baseline: middle; }
      .step-prep { fill: #0f766e; }
      .step-decide { fill: #b45309; }
      .step-out { fill: #6d28d9; }
      .accent-prep { fill: #0f766e; }
      .accent-decide { fill: #b45309; }
      .accent-out { fill: #6d28d9; }
      .chip-text { font-size: 15px; font-weight: 700; text-anchor: middle; }
      .chip-prep { fill: #ccfbf1; stroke: #0f766e; }
      .chip-decide { fill: #fef3c7; stroke: #b45309; }
      .chip-out { fill: #ede9fe; stroke: #6d28d9; }
      .chip-text-prep { fill: #115e59; }
      .chip-text-decide { fill: #92400e; }
      .chip-text-out { fill: #5b21b6; }
      .arrow { fill: none; stroke: #64748b; stroke-width: 3; marker-end: url(#arrowhead); }
      .arrow-head { fill: #64748b; }
      .foot { fill: #475569; font-size: 15px; }
      text { font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif; }
      @media (prefers-color-scheme: dark) {
        .background { fill: #111827; stroke: #475569; }
        .card { fill: #1f2937; stroke: #475569; }
        .heading { fill: #f8fafc; }
        .subtle { fill: #94a3b8; }
        .title { fill: #f8fafc; }
        .detail { fill: #cbd5e1; }
        .step-prep { fill: #14b8a6; }
        .step-decide { fill: #f59e0b; }
        .step-out { fill: #8b5cf6; }
        .accent-prep { fill: #14b8a6; }
        .accent-decide { fill: #f59e0b; }
        .accent-out { fill: #8b5cf6; }
        .chip-prep { fill: #134e4a; stroke: #14b8a6; }
        .chip-decide { fill: #78350f; stroke: #f59e0b; }
        .chip-out { fill: #4c1d95; stroke: #8b5cf6; }
        .chip-text-prep { fill: #99f6e4; }
        .chip-text-decide { fill: #fde68a; }
        .chip-text-out { fill: #ddd6fe; }
        .arrow { stroke: #94a3b8; }
        .arrow-head { fill: #94a3b8; }
        .foot { fill: #cbd5e1; }
      }
    </style>
  </defs>

  <rect class="background" x="15" y="15" width="970" height="850" rx="24"/>
  <text class="heading" x="55" y="58">把一个排序合出来：六个步骤，一次回炉</text>
  <text class="subtle" x="55" y="88">第 3、4 步是可以挑的地方最多的两步；第 6 步不合格，就要退回这两步重做</text>

  <g>
    <rect class="card" x="55" y="110" width="890" height="90" rx="16"/>
    <rect class="accent-prep" x="55" y="110" width="10" height="90" rx="5"/>
    <circle class="step-prep" cx="105" cy="155" r="25"/>
    <text class="step-text" x="105" y="156">1</text>
    <text class="title" x="150" y="148">方向对齐</text>
    <text class="detail" x="150" y="178">每个因子乘上 +1 或 −1，让值越大统一表示越看好</text>
    <rect class="chip-prep" x="760" y="138" width="165" height="34" rx="17"/>
    <text class="chip-text chip-text-prep" x="842" y="160">程序不会报错</text>
  </g>

  <path class="arrow" d="M 500 202 L 500 226"/>

  <g>
    <rect class="card" x="55" y="228" width="890" height="90" rx="16"/>
    <rect class="accent-prep" x="55" y="228" width="10" height="90" rx="5"/>
    <circle class="step-prep" cx="105" cy="273" r="25"/>
    <text class="step-text" x="105" y="274">2</text>
    <text class="title" x="150" y="266">可比化</text>
    <text class="detail" x="150" y="296">同一形成日转成 0—100 的分位（默认），或 z 分数</text>
    <rect class="chip-prep" x="760" y="256" width="165" height="34" rx="17"/>
    <text class="chip-text chip-text-prep" x="842" y="278">两种口径别混用</text>
  </g>

  <path class="arrow" d="M 500 320 L 500 344"/>

  <g>
    <rect class="card" x="55" y="346" width="890" height="90" rx="16"/>
    <rect class="accent-decide" x="55" y="346" width="10" height="90" rx="5"/>
    <circle class="step-decide" cx="105" cy="391" r="25"/>
    <text class="step-text" x="105" y="392">3</text>
    <text class="title" x="150" y="384">看相关矩阵</text>
    <text class="detail" x="150" y="414">相关系数高的先处理：删一个、合成一个、正交化</text>
    <rect class="chip-decide" x="760" y="374" width="165" height="34" rx="17"/>
    <text class="chip-text chip-text-decide" x="842" y="396">先处理再相加</text>
  </g>

  <path class="arrow" d="M 500 438 L 500 462"/>

  <g>
    <rect class="card" x="55" y="464" width="890" height="90" rx="16"/>
    <rect class="accent-decide" x="55" y="464" width="10" height="90" rx="5"/>
    <circle class="step-decide" cx="105" cy="509" r="25"/>
    <text class="step-text" x="105" y="510">4</text>
    <text class="title" x="150" y="502">定权重</text>
    <text class="detail" x="150" y="532">默认分位等权；要偏离，得有样本外依据，权重只用过去数据估</text>
    <rect class="chip-decide" x="760" y="492" width="165" height="34" rx="17"/>
    <text class="chip-text chip-text-decide" x="842" y="514">可挑的地方最多</text>
  </g>

  <path class="arrow" d="M 500 556 L 500 580"/>

  <g>
    <rect class="card" x="55" y="582" width="890" height="90" rx="16"/>
    <rect class="accent-out" x="55" y="582" width="10" height="90" rx="5"/>
    <circle class="step-out" cx="105" cy="627" r="25"/>
    <text class="step-text" x="105" y="628">5</text>
    <text class="title" x="150" y="620">合成总分</text>
    <text class="detail" x="150" y="650">按权重相加，或按排名相乘，得到每只股票一个分数</text>
    <rect class="chip-out" x="760" y="610" width="165" height="34" rx="17"/>
    <text class="chip-text chip-text-out" x="842" y="632">得到一个排序</text>
  </g>

  <path class="arrow" d="M 500 674 L 500 698"/>

  <g>
    <rect class="card" x="55" y="700" width="890" height="90" rx="16"/>
    <rect class="accent-out" x="55" y="700" width="10" height="90" rx="5"/>
    <circle class="step-out" cx="105" cy="745" r="25"/>
    <text class="step-text" x="105" y="746">6</text>
    <text class="title" x="150" y="738">当作新因子重新检验</text>
    <text class="detail" x="150" y="768">重走第29章检验、第30章审查；不合格就退回第 3、4 步</text>
    <rect class="chip-out" x="760" y="728" width="165" height="34" rx="17"/>
    <text class="chip-text chip-text-out" x="842" y="750">不是收尾动作</text>
  </g>

  <text class="foot" x="55" y="822">前两步决定分数可不可比，中间两步决定权重从哪来，最后一步决定这个分数值不值得用。</text>
  <text class="foot" x="55" y="850">合成出来的分数自己也有 IC、换手率和样本外表现——它和任何一个单因子一样，都要被检验过才能进组合。</text>
</svg>
