<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 610" role="img" aria-labelledby="title desc">
<title id="title">调仓从目标到实际持仓的处理顺序（示意）</title>
<desc id="desc">用已知信息确定目标，核对实际持仓、可卖数量、现金和有效委托，发出可执行订单，再读取成交回报。已成交部分更新持仓和现金，未成交部分保留实际状态。剩余需求在下一检查时点重新评估，先确认旧单状态，避免重复委托。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/></marker></defs>
<rect width="900" height="610" rx="16" fill="#f8fafc"/>
<g font-family="'Microsoft YaHei','PingFang SC',sans-serif" fill="#0f172a">
<text x="30" y="38" font-size="23" font-weight="700">目标没有完成，账户也必须按真实成交记录</text>
<text x="30" y="66" font-size="15" fill="#475569">流程示意｜箭头表示处理顺序；未成交卖单不能提供买入资金</text>
<rect x="180" y="90" width="540" height="61" rx="10" fill="#dbeafe" stroke="#93c5fd"/>
<text x="200" y="116" font-size="18" font-weight="700">1　确定当前有效目标</text>
<text x="200" y="139" font-size="15">只用当时已知的信息，应用持仓与风险规则</text>
<rect x="180" y="179" width="540" height="65" rx="10" fill="#dbeafe" stroke="#93c5fd"/>
<text x="200" y="206" font-size="18" font-weight="700">2　核对账户，再形成可执行订单</text>
<text x="200" y="230" font-size="15">实际持仓、可卖数量、可用现金、仍有效的委托</text>
<rect x="180" y="272" width="540" height="61" rx="10" fill="#e0f2fe" stroke="#7dd3fc"/>
<text x="200" y="298" font-size="18" font-weight="700">3　下单后读取成交回报</text>
<text x="200" y="321" font-size="15">部分成交就拆开处理，不能按整笔目标更新</text>
<rect x="45" y="374" width="380" height="82" rx="10" fill="#dcfce7" stroke="#86efac"/>
<text x="65" y="405" font-size="19" font-weight="700">已成交部分</text>
<text x="65" y="435" font-size="16">更新证券数量与现金，记录费用</text>
<rect x="475" y="374" width="380" height="82" rx="10" fill="#fef3c7" stroke="#fcd34d"/>
<text x="495" y="405" font-size="19" font-weight="700">未成交部分</text>
<text x="495" y="435" font-size="16">持仓不会凭空消失，卖出款不会到账</text>
<rect x="180" y="500" width="540" height="71" rx="10" fill="#ede9fe" stroke="#c4b5fd"/>
<text x="200" y="529" font-size="18" font-weight="700">4　下一检查时点重新评估剩余需求</text>
<text x="200" y="554" font-size="15">先确认旧单状态，再核对最新目标；回到步骤 1、2</text>
</g>
<g stroke="#64748b" stroke-width="2.3" fill="none" marker-end="url(#arrow)">
<path d="M450 151 V174"/><path d="M450 244 V267"/>
<path d="M350 333 V352 H235 V369"/><path d="M550 333 V352 H665 V369"/>
<path d="M235 456 V495"/><path d="M665 456 V495"/>
<path d="M180 536 H18 V120 H174"/>
</g>
</svg>
