<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 392" width="100%" role="img" aria-labelledby="ch32shiftTitle ch32shiftDesc">
  <title id="ch32shiftTitle">过滤前后股票池的市值分位分布变化</title>
  <desc id="ch32shiftDesc">分组柱状图对比过滤前与过滤后各市值分位档的股票数量。过滤前数量随市值档上升而下降，最小的一档最多；过滤后各档数量趋于接近，最小档被削掉最多，说明过滤在减少股票数量的同时把池子重心推向大市值。</desc>
  <defs></defs>
  <style>
    .tt{font:500 13px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#2C2C2A}
    .tm{font:400 12px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#5F5E5A}
    .grid{stroke:#D3D1C7;stroke-width:0.5}
    .axis{stroke:#B4B2A9;stroke-width:0.5}
    .b1{fill:#378ADD}
    .b2{fill:#1D9E75}
    @media (prefers-color-scheme: dark){
      .tt{fill:#F1F5F9}
      .tm{fill:#CBD5E1}
      .grid{stroke:#444441}
      .axis{stroke:#94A3B8}
      .b1{fill:#85B7EB}
      .b2{fill:#5DCAA5}
    }
  </style>

  <rect class="b1" x="400" y="40" width="10" height="10" rx="2"/>
  <text class="tm" x="416" y="49">过滤前</text>
  <rect class="b2" x="480" y="40" width="10" height="10" rx="2"/>
  <text class="tm" x="496" y="49">过滤后</text>

  <line class="grid" x1="80" y1="120" x2="640" y2="120"/>
  <line class="grid" x1="80" y1="190" x2="640" y2="190"/>
  <line class="grid" x1="80" y1="260" x2="640" y2="260"/>
  <line class="axis" x1="80" y1="330" x2="640" y2="330"/>

  <text class="tm" x="72" y="124" text-anchor="end">600</text>
  <text class="tm" x="72" y="194" text-anchor="end">400</text>
  <text class="tm" x="72" y="264" text-anchor="end">200</text>
  <text class="tm" x="72" y="334" text-anchor="end">0</text>

  <rect class="b1" x="88" y="85" width="18" height="245" rx="2"/>
  <rect class="b2" x="110" y="225" width="18" height="105" rx="2"/>

  <rect class="b1" x="144" y="113" width="18" height="217" rx="2"/>
  <rect class="b2" x="166" y="193.5" width="18" height="136.5" rx="2"/>

  <rect class="b1" x="200" y="134" width="18" height="196" rx="2"/>
  <rect class="b2" x="222" y="183" width="18" height="147" rx="2"/>

  <rect class="b1" x="256" y="155" width="18" height="175" rx="2"/>
  <rect class="b2" x="278" y="179.5" width="18" height="150.5" rx="2"/>

  <rect class="b1" x="312" y="165.5" width="18" height="164.5" rx="2"/>
  <rect class="b2" x="334" y="179.5" width="18" height="150.5" rx="2"/>

  <rect class="b1" x="368" y="176" width="18" height="154" rx="2"/>
  <rect class="b2" x="390" y="183" width="18" height="147" rx="2"/>

  <rect class="b1" x="424" y="183" width="18" height="147" rx="2"/>
  <rect class="b2" x="446" y="184.75" width="18" height="145.25" rx="2"/>

  <rect class="b1" x="480" y="190" width="18" height="140" rx="2"/>
  <rect class="b2" x="502" y="188.25" width="18" height="141.75" rx="2"/>

  <rect class="b1" x="536" y="193.5" width="18" height="136.5" rx="2"/>
  <rect class="b2" x="558" y="191.75" width="18" height="138.25" rx="2"/>

  <rect class="b1" x="592" y="197" width="18" height="133" rx="2"/>
  <rect class="b2" x="614" y="195.25" width="18" height="134.75" rx="2"/>

  <text class="tm" x="108" y="348" text-anchor="middle">0–10%</text>
  <text class="tm" x="164" y="348" text-anchor="middle">10–20%</text>
  <text class="tm" x="220" y="348" text-anchor="middle">20–30%</text>
  <text class="tm" x="276" y="348" text-anchor="middle">30–40%</text>
  <text class="tm" x="332" y="348" text-anchor="middle">40–50%</text>
  <text class="tm" x="388" y="348" text-anchor="middle">50–60%</text>
  <text class="tm" x="444" y="348" text-anchor="middle">60–70%</text>
  <text class="tm" x="500" y="348" text-anchor="middle">70–80%</text>
  <text class="tm" x="556" y="348" text-anchor="middle">80–90%</text>
  <text class="tm" x="612" y="348" text-anchor="middle">90–100%</text>

  <text class="tm" x="40" y="372">横轴为市值分位档，纵轴为股票数量（只）；数据为示意。</text>
</svg>
