  <line class="baseline" x1="610" y1="360" x2="1010" y2="360"/>
  <line class="band" x1="765" y1="182" x2="765" y2="360"/>
  <line class="band" x1="855" y1="182" x2="855" y2="360"/>
  <line class="zero" x1="810" y1="182" x2="810" y2="360"/>
  <text class="panel-title" x="612" y="176">股票B：上涨平缓，下跌集中</text>
  <text class="tick" x="720" y="354" text-anchor="middle">−2σ</text>
  <text class="tick" x="810" y="354" text-anchor="middle">0</text>

  <rect class="chip-shade" x="90" y="414" width="16" height="16" rx="4"/>
  <text class="foot" x="118" y="428">深红底纹：落在 −2 标准差以外的下跌日 —— 股票A 约 2.4%，股票B 约 5.5%（示意）</text>
  <rect class="chip-zero" x="90" y="448" width="16" height="16" rx="4"/>
  <text class="foot" x="118" y="462">紫色竖线：日收益为 0 的分界；灰色虚线：±1 标准差范围，两只宽度相同</text>
  <text class="foot" x="90" y="492">结论：总波动率只说明抖动有多大，看不出抖向哪一边；判断持有感受还要看下行波动率。</text>
</svg>
