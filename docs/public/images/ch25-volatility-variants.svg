  <line class="baseline" x1="110" y1="360" x2="510" y2="360"/>
  <line class="band" x1="265" y1="182" x2="265" y2="360"/>
  <line class="band" x1="355" y1="182" x2="355" y2="360"/>
  <line class="zero" x1="310" y1="182" x2="310" y2="360"/>
  <text class="panel-title" x="112" y="176">股票A：涨跌大致对称</text>
  <text class="tick" x="220" y="354" text-anchor="middle">−2σ</text>
  <text class="tick" x="310" y="354" text-anchor="middle">0</text>

  <rect class="panel" x="590" y="140" width="440" height="250" rx="14"/>
  <path class="shade" d="M675.0 360 L675.0 352.9 Q679.5 351.1 681.8 350.0 Q684.0 349.0 686.2 347.9 Q688.5 346.8 690.8 345.6 Q693.0 344.5 695.2 343.3 Q697.5 342.2 699.8 341.1 Q702.0 339.9 704.2 338.9 Q706.5 337.9 708.8 337.1 Q711.0 336.2 713.2 335.6 Q715.5 334.9 717.8 334.4 L720.0 333.9 L720.0 360 Z"/>
