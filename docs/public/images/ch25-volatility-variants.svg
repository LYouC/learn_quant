<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 520" role="img" aria-labelledby="title desc">
  <title id="title">总波动率相同，下跌的集中程度可以完全不同</title>
  <desc id="desc">示意：左右两张分别是股票A和股票B的日收益率分布，横轴是当日涨跌，竖轴是出现频率。两只股票的波动范围由相同的灰色虚线标出，也就是总波动率接近。股票A左右大致对称；股票B的峰值略偏右，但左侧有一条更长更厚的尾巴，落在负两个标准差以外的下跌日明显更多，因此它的下行波动率更高。</desc>
  <defs>
    <style>
      .background { fill: #f8fafc; stroke: #cbd5e1; }
      .panel { fill: #ffffff; stroke: #94a3b8; stroke-width: 2; }
      .shade { fill: #fecaca; }
      .curve { stroke: #2563eb; stroke-width: 3; fill: none; }
      .baseline { stroke: #94a3b8; stroke-width: 2; }
      .band { stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 7 5; }
      .zero { stroke: #7c3aed; stroke-width: 2.5; }
      .heading { fill: #0f172a; font-size: 25px; font-weight: 700; }
      .subtle { fill: #64748b; font-size: 15px; }
      .panel-title { fill: #0f172a; font-size: 17px; font-weight: 700; }
      .tick { fill: #64748b; font-size: 13px; }
      .foot { fill: #475569; font-size: 15px; }
      .chip-shade { fill: #fecaca; stroke: #dc2626; stroke-width: 1.5; }
      .chip-zero { fill: #7c3aed; }
      text { font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif; }
      @media (prefers-color-scheme: dark) {
        .background { fill: #111827; stroke: #475569; }
        .panel { fill: #1f2937; stroke: #64748b; }
        .shade { fill: #7f1d1d; }
        .curve { stroke: #60a5fa; }
        .baseline, .band { stroke: #64748b; }
        .zero { stroke: #a78bfa; }
        .heading, .panel-title { fill: #f8fafc; }
        .subtle, .tick { fill: #94a3b8; }
        .foot { fill: #cbd5e1; }
        .chip-shade { fill: #7f1d1d; stroke: #f87171; }
        .chip-zero { fill: #a78bfa; }
      }
    </style>
  </defs>

  <rect class="background" x="15" y="15" width="1090" height="490" rx="24"/>
  <text class="heading" x="55" y="62">总波动率相同，下跌的集中程度可以完全不同</text>
  <text class="subtle" x="55" y="94">示意：左右是两只股票的日收益率分布，灰色虚线是宽度相同的 ±1 标准差范围</text>

