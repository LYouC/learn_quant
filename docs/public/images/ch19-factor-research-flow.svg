<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 710" role="img" aria-labelledby="title desc">
  <title id="title">从投资现象到未来结果的因子研究流程</title>
  <desc id="desc">流程自上而下分为五步：提出投资现象、选择可观察数据、固定形成日信号、规定比较与持有、观察未来结果。</desc>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-head"/>
    </marker>
    <style>
      .background { fill: #f8fafc; stroke: #cbd5e1; }
      .card { fill: #ffffff; stroke: #cbd5e1; }
      .accent { fill: #2563eb; }
      .step { fill: #2563eb; }
      .step-text { fill: #ffffff; font-size: 20px; font-weight: 700; text-anchor: middle; dominant-baseline: middle; }
      .heading { fill: #0f172a; font-size: 23px; font-weight: 700; }
      .detail { fill: #475569; font-size: 18px; }
      .arrow { fill: none; stroke: #64748b; stroke-width: 3; marker-end: url(#arrowhead); }
      .arrow-head { fill: #64748b; }
      text { font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif; }
      @media (prefers-color-scheme: dark) {
        .background { fill: #111827; stroke: #475569; }
        .card { fill: #1f2937; stroke: #475569; }
        .heading { fill: #f8fafc; }
        .detail { fill: #cbd5e1; }
        .arrow { stroke: #94a3b8; }
        .arrow-head { fill: #94a3b8; }
      }
    </style>
  </defs>

  <rect class="background" x="15" y="15" width="970" height="680" rx="24"/>

  <g>
    <rect class="card" x="55" y="35" width="890" height="100" rx="16"/>
    <rect class="accent" x="55" y="35" width="10" height="100" rx="5"/>
    <circle class="step" cx="105" cy="85" r="25"/>
    <text class="step-text" x="105" y="86">1</text>
    <text class="heading" x="150" y="78">提出投资现象</text>
    <text class="detail" x="150" y="108">市场可能低估了哪类公司？</text>
  </g>

  <path class="arrow" d="M 500 137 L 500 163"/>

  <g>
    <rect class="card" x="55" y="170" width="890" height="100" rx="16"/>
    <rect class="accent" x="55" y="170" width="10" height="100" rx="5"/>
    <circle class="step" cx="105" cy="220" r="25"/>
    <text class="step-text" x="105" y="221">2</text>
    <text class="heading" x="150" y="213">选择可观察数据</text>
    <text class="detail" x="150" y="243">用哪项价格、财务或交易指标表示？</text>
  </g>

  <path class="arrow" d="M 500 272 L 500 298"/>

  <g>
    <rect class="card" x="55" y="305" width="890" height="100" rx="16"/>
    <rect class="accent" x="55" y="305" width="10" height="100" rx="5"/>
    <circle class="step" cx="105" cy="355" r="25"/>
    <text class="step-text" x="105" y="356">3</text>
    <text class="heading" x="150" y="348">固定形成日信号</text>
    <text class="detail" x="150" y="378">当时已经知道什么？数值越高表示什么？</text>
  </g>

  <path class="arrow" d="M 500 407 L 500 433"/>

  <g>
    <rect class="card" x="55" y="440" width="890" height="100" rx="16"/>
    <rect class="accent" x="55" y="440" width="10" height="100" rx="5"/>
    <circle class="step" cx="105" cy="490" r="25"/>
    <text class="step-text" x="105" y="491">4</text>
    <text class="heading" x="150" y="483">规定比较与持有</text>
    <text class="detail" x="150" y="513">和谁比较？何时买入？观察多长时间？</text>
  </g>

  <path class="arrow" d="M 500 542 L 500 568"/>

  <g>
    <rect class="card" x="55" y="575" width="890" height="100" rx="16"/>
    <rect class="accent" x="55" y="575" width="10" height="100" rx="5"/>
    <circle class="step" cx="105" cy="625" r="25"/>
    <text class="step-text" x="105" y="626">5</text>
    <text class="heading" x="150" y="618">观察未来结果</text>
    <text class="detail" x="150" y="648">收益差异是否稳定？风险和成本能否接受？</text>
  </g>
</svg>
